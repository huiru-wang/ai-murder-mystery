user root;
worker_processes auto;

pid /run/nginx.pid;
error_log /var/log/nginx/error.log;

include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;

    upstream murder_mystery_api {
        server 127.0.0.1:3200;
        keepalive 16;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name ai-murder-mystery.robinverse.me;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name ai-murder-mystery.robinverse.me;

        ssl_certificate /etc/nginx/ssl/robinverse.me.pem;
        ssl_certificate_key /etc/nginx/ssl/robinverse.me.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location = /health {
            proxy_pass http://murder_mystery_api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location ^~ /api/ {
            proxy_pass http://murder_mystery_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }

        location / {
            root /var/www/ai-murder-mystery;
            try_files $uri $uri/ /index.html;
        }
    }
}
